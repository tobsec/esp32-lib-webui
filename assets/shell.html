<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web UI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/pico.min.css">
<link rel="stylesheet" href="/webui.css">
<link rel="stylesheet" href="/themes/dark.css">
<link rel="stylesheet" href="/themes/light.css">
<!-- Optional project-supplied theme. The lib serves a 404 if the
     consumer didn't ship one; the inline error handler then drops
     the <link> so the network panel stays quiet. -->
<link rel="stylesheet" href="/theme.css" onerror="this.remove()">
<script>
  // Apply the persisted theme before paint so there's no flash of
  // wrong colours on a fresh tab. localStorage is sandboxed per
  // origin; a fresh device starts in dark by default.
  document.documentElement.dataset.theme =
    (localStorage.getItem("webui-theme") || "dark");
</script>
<script defer src="/vendor/alpine.min.js"></script>
</head>
<body>

<header class="webui-header">
  <span class="webui-dot" id="webui-status-dot"></span>
  <h1 id="webui-title">Web UI</h1>
  <button type="button" class="webui-theme-toggle" title="Toggle theme"
          onclick="webui.theme.toggle()">◐</button>
</header>

<nav class="webui-tabs" id="webui-tab-nav" style="display:none"></nav>

<main class="webui-container">

  <article x-data="status">
    <header><strong>Status</strong></header>
    <table>
      <tbody>
        <template x-for="entry in entries" :key="entry[0]">
          <tr><th scope="row" x-text="entry[0]"></th><td x-text="entry[1]"></td></tr>
        </template>
        <tr x-show="error">
          <td colspan="2"><kbd x-text="error"></kbd></td>
        </tr>
      </tbody>
    </table>
    <footer><small class="webui-muted" x-text="freshness"></small></footer>
  </article>

  <!-- Project panels land here. If they declare data-tab=" " attributes
       webui.tabs.discover() builds the nav strip above; otherwise the
       panels render in document order. -->
  <div id="project-panels"></div>

</main>

<script src="/webui.js"></script>
<script src="/shell.js"></script>
</body>
</html>
